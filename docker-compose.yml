services:
  webhook:
    image: ghcr.io/khw315/openproject-title-validator:latest
    container_name: op-title-validator
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - openproject-net
    env_file:
      - .env
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  openproject-net:
    name: openproject-net
    driver: bridge
